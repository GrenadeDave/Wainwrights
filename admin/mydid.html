<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyDiD phone — Wainwright’s admin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=6a7fc184">
<link rel="stylesheet" href="../assets/css/portal.css?v=b3e96d35">
</head>
<body class="portal-body">

<header class="site-header portal-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../assets/img/logo-badge-dark-256.png" width="256" height="256" alt="">
      <span class="brand-text"><span class="brand-name">Wainwright’s</span><span class="brand-sub">MyDiD phone</span></span>
    </a>
    <div class="who">
      <a class="plain" href="index.html">Job board</a>
      <a class="plain" href="schedule.html">Schedule</a>
      <a class="plain" href="reviews.html">Reviews</a>
      <a class="plain" href="team.html">Admins</a>
      <a class="plain" href="#" id="signout">Sign out</a>
    </div>
  </div>
</header>

<main class="portal-main">
  <div class="wrap wrap--portal" id="root">
    <p style="color:var(--muted)">Loading&hellip;</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="../assets/js/config.js?v=21996240"></script>
<script src="../assets/js/rates.js?v=ca3e6828"></script>
<script src="../assets/js/schedule.js?v=4da46a2e"></script>
<script src="../assets/js/supabase-config.js?v=f549751b"></script>
<script src="../assets/js/portal.js?v=cd74eae6"></script>
<script src="../assets/js/portal-demo.js?v=53340b32"></script>
<script src="../assets/js/site.js?v=a5ec3b12"></script>
<script>
(function () {
  'use strict';
  var P = window.WPortal;
  var root  = document.getElementById('root');
  var toast = document.getElementById('toast');
  var timer = null;
  var known = 0;          // phones connected when the code was made

  if (!P.ready()) { root.innerHTML = P.notConfiguredHtml(); return; }

  /* The tour copy of this page swaps Sign out for "Leave the tour", so the
     button is not always here. */
  var signout = document.getElementById('signout');
  if (signout) signout.addEventListener('click', async function (e) {
    e.preventDefault();
    await P.signOut();
    window.location.replace('../portal/login.html');
  });

  function flash(m) {
    toast.textContent = m; toast.classList.add('is-up');
    setTimeout(function () { toast.classList.remove('is-up'); }, 2600);
  }

  function phoneRow(d) {
    var seen = d.last_seen_at ? 'Last checked in ' + P.ago(d.last_seen_at) : 'Not checked in yet';
    return '<li class="device">' +
      '<div><b>' + P.esc(d.label) + '</b>' +
        '<span>' + P.esc('Connected ' + (P.date(d.created_at) || '') + ' · ' + seen) + '</span>' +
        (d.fcm_token ? '<span class="device-ok">Notifications on</span>'
                     : '<span class="device-warn">Notifications off — open MyDiD to turn them back on</span>') +
      '</div>' +
      '<button class="btn btn-outline" type="button" data-drop="' + P.esc(d.id) + '" data-name="' + P.esc(d.label) + '">Disconnect</button>' +
    '</li>';
  }

  /* ----------------------------------------------------------------------
     The tour version of this page
     ----------------------------------------------------------------------
     The tour lives at /demo/ and anyone can open it. Connecting a phone is
     not something to put in front of a stranger, not even as a button that
     does nothing, so the whole card is replaced with a look at what MyDiD
     shows Bryan once his phone IS connected.

     Pairing is refused by the database itself, not by this page: a visitor
     or a customer calling create_pairing_code is turned away by Postgres.
     This is about what people are shown. */
  function demoPage() {
    root.innerHTML =
      '<div class="portal-title"><h1>MyDiD phone</h1>' +
        '<p>Bryan runs his day from MyDiD. Once his phone is connected, every request from ' +
        'this website lands there \u2014 and buzzes him while he is still up a ladder somewhere.</p></div>' +

      '<div class="panel-card">' +
        '<h2>What Bryan sees on his phone</h2>' +
        '<div class="phone-shots">' + phoneList() + phoneJob() + '</div>' +
        '<p class="form-note" style="text-align:left;margin-top:18px">' +
        'Sample jobs \u2014 not real customers. Connecting a phone is done from Bryan\u2019s own ' +
        'signed-in account and is not part of this tour.</p>' +
      '</div>' +

      '<div class="panel-card">' +
        '<h2>Why it is wired this way</h2>' +
        '<p>A request made here at nine at night is on his phone at nine at night, with the ' +
        'address, the job and the phone number already filled in. Nothing gets retyped, so ' +
        'nothing gets lost between the website and the work.</p>' +
        '<a class="btn btn-outline" href="../index.html">Back to the website</a>' +
      '</div>';
  }

  /* Two phone screens, drawn rather than photographed: they stay sharp on
     every display, weigh nothing, and carry no real customer's details. */
  function phoneShell(inner) {
    return '<svg class="phone-shot" viewBox="0 0 300 600" role="img" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="4" y="4" width="292" height="592" rx="38" fill="#11181f"/>' +
      '<rect x="12" y="12" width="276" height="576" rx="31" fill="#FBFAF7"/>' +
      inner + '</svg>';
  }

  function tile(y, who, what, where, when, state, isNew) {
    var fill = isNew ? '#FFF3D6' : '#FFFFFF';
    var edge = isNew ? '#FAA90D' : '#E4E0D6';
    return '<rect x="26" y="' + y + '" width="248" height="86" rx="14" fill="' + fill + '" stroke="' + edge + '"/>' +
      '<text x="40" y="' + (y + 26) + '" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#11181f">' + who + '</text>' +
      '<text x="40" y="' + (y + 46) + '" font-family="Inter,sans-serif" font-size="12" fill="#5c6470">' + what + '</text>' +
      '<text x="40" y="' + (y + 65) + '" font-family="Inter,sans-serif" font-size="11" fill="#8a909a">' + where + '</text>' +
      '<text x="258" y="' + (y + 26) + '" text-anchor="end" font-family="Inter,sans-serif" font-size="11" fill="#8a909a">' + when + '</text>' +
      '<rect x="180" y="' + (y + 52) + '" width="78" height="19" rx="9.5" fill="' + (isNew ? '#FAA90D' : '#EFECE4') + '"/>' +
      '<text x="219" y="' + (y + 65) + '" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" font-weight="700" fill="#11181f">' + state + '</text>';
  }

  function phoneList() {
    return phoneShell(
      '<path d="M12 43a31 31 0 0 1 31-31h214a31 31 0 0 1 31 31v43H12z" fill="#11181f"/>' +
      '<text x="30" y="46" font-family="Archivo,sans-serif" font-size="19" font-weight="800" fill="#FAA90D">MyDiD</text>' +
      '<text x="30" y="68" font-family="Inter,sans-serif" font-size="11" fill="#c7ccd3">Today \u00b7 4 jobs \u00b7 1 new</text>' +
      tile(104, 'Margaret Ellis', 'Handyman repairs', 'Pine Mountain Lake', 'new', 'FROM WEBSITE', true) +
      tile(202, 'Pat Sample', 'Yard waste removal', 'Groveland', '2h', 'QUOTED', false) +
      tile(300, 'Dale Hooper', 'Defensible space', 'Groveland', 'Tue', 'BOOKED IN', false) +
      tile(398, 'Rosa Nu\u00f1ez', 'Interior painting', 'Pine Mountain Lake', 'Thu', 'BOOKED IN', false) +
      '<path d="M12 512h276v45a31 31 0 0 1-31 31H43a31 31 0 0 1-31-31z" fill="#F2EFE7"/>' +
      '<line x1="12" y1="512" x2="288" y2="512" stroke="#E4E0D6"/>' +
      '<text x="66" y="543" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" font-weight="700" fill="#11181f">Jobs</text>' +
      '<rect x="46" y="551" width="40" height="3" rx="1.5" fill="#FAA90D"/>' +
      '<text x="150" y="543" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#8a909a">Schedule</text>' +
      '<text x="234" y="543" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#8a909a">Money</text>'
    );
  }

  function phoneJob() {
    return phoneShell(
      '<path d="M12 43a31 31 0 0 1 31-31h214a31 31 0 0 1 31 31v43H12z" fill="#11181f"/>' +
      '<text x="30" y="42" font-family="Inter,sans-serif" font-size="11" fill="#c7ccd3">\u2190 Jobs</text>' +
      '<text x="30" y="68" font-family="Archivo,sans-serif" font-size="17" font-weight="800" fill="#ffffff">Margaret Ellis</text>' +
      '<rect x="26" y="102" width="248" height="24" rx="12" fill="#FAA90D"/>' +
      '<text x="150" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#11181f">CAME IN FROM THE WEBSITE</text>' +
      '<text x="30" y="156" font-family="Archivo,sans-serif" font-size="17" font-weight="800" fill="#11181f">Handyman repairs</text>' +
      '<text x="30" y="178" font-family="Inter,sans-serif" font-size="12" fill="#5c6470">48 Sample Court, Pine Mountain Lake</text>' +
      '<text x="30" y="197" font-family="Inter,sans-serif" font-size="12" fill="#5c6470">(209) 555-0118</text>' +
      '<rect x="26" y="214" width="248" height="98" rx="14" fill="#FFFFFF" stroke="#E4E0D6"/>' +
      '<text x="40" y="238" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#8a909a">WHAT THEY ASKED FOR</text>' +
      '<text x="40" y="261" font-family="Inter,sans-serif" font-size="12" fill="#11181f">Screen door will not latch and</text>' +
      '<text x="40" y="280" font-family="Inter,sans-serif" font-size="12" fill="#11181f">two kitchen cabinet doors are</text>' +
      '<text x="40" y="299" font-family="Inter,sans-serif" font-size="12" fill="#11181f">hanging off their hinges.</text>' +
      '<rect x="26" y="326" width="119" height="40" rx="10" fill="#FAA90D"/>' +
      '<text x="85" y="351" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#11181f">Send a price</text>' +
      '<rect x="155" y="326" width="119" height="40" rx="10" fill="#FFFFFF" stroke="#11181f" stroke-width="1.5"/>' +
      '<text x="214" y="351" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#11181f">Call Margaret</text>' +
      '<text x="30" y="398" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#8a909a">HISTORY</text>' +
      '<line x1="34" y1="418" x2="34" y2="470" stroke="#E4E0D6" stroke-width="2"/>' +
      '<circle cx="34" cy="418" r="5" fill="#FAA90D"/>' +
      '<text x="50" y="416" font-family="Inter,sans-serif" font-size="11.5" fill="#11181f">Request came in from the website</text>' +
      '<text x="50" y="432" font-family="Inter,sans-serif" font-size="10" fill="#8a909a">Today, 7:12 AM</text>' +
      '<circle cx="34" cy="470" r="5" fill="#d6d2c8"/>' +
      '<text x="50" y="468" font-family="Inter,sans-serif" font-size="11.5" fill="#11181f">Phone buzzed \u2014 alert delivered</text>' +
      '<text x="50" y="484" font-family="Inter,sans-serif" font-size="10" fill="#8a909a">Today, 7:12 AM</text>' +
      '<rect x="26" y="506" width="248" height="62" rx="14" fill="#11181f"/>' +
      '<text x="42" y="530" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#FAA90D">WAINWRIGHTS</text>' +
      '<text x="42" y="549" font-family="Inter,sans-serif" font-size="11.5" fill="#ffffff">New request \u2014 Margaret Ellis,</text>' +
      '<text x="42" y="564" font-family="Inter,sans-serif" font-size="11.5" fill="#ffffff">handyman repairs</text>'
    );
  }

  async function paint() {
    if (P.demo) return demoPage();
    var res = await P.client().from('devices').select('*').order('created_at', { ascending: true });
    if (res.error) {
      root.innerHTML = '<div class="portal-empty"><h2>Could not load</h2><p>' + P.esc(res.error.message) + '</p></div>';
      return;
    }
    var phones = res.data || [];
    known = phones.length;

    root.innerHTML =
      '<div class="portal-title"><h1>MyDiD phone</h1>' +
        '<p>Connect MyDiD so new requests buzz your phone and land in your job tiles.</p></div>' +

      '<div class="panel-card" id="pair-card">' +
        '<h2>Connect a phone</h2>' +
        '<ol class="steps-plain">' +
          '<li>Press <b>Get a pairing code</b>.</li>' +
          '<li>On the phone, open <b>MyDiD → Settings → Connect to website</b>.</li>' +
          '<li>Type the code in. It works once, for 10 minutes.</li>' +
        '</ol>' +
        '<div id="code-box"></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" type="button" id="get-code">Get a pairing code</button>' +
          '<button class="btn btn-outline" type="button" id="email-code">Email it to Bryan</button>' +
        '</div>' +
      '</div>' +

      '<div class="panel-card">' +
        '<h2>Connected phones</h2>' +
        (phones.length
          ? '<ul class="device-list">' + phones.map(phoneRow).join('') + '</ul>'
          : '<p style="margin:0;color:var(--muted)">None yet.</p>') +
        '<p class="form-note" style="text-align:left;margin-top:14px">Lost or replaced a phone? Disconnect it here. ' +
        'It stops getting alerts and can no longer see jobs, straight away.</p>' +
      '</div>';

    document.getElementById('get-code').addEventListener('click', getCode);
    document.getElementById('email-code').addEventListener('click', emailCode);
    root.querySelectorAll('[data-drop]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var ok = await P.confirm({
          title: 'Disconnect ' + b.dataset.name + '?',
          body: 'It will stop getting alerts and can no longer see jobs. You can connect it again with a new code.',
          ok: 'Disconnect', cancel: 'Keep it', danger: true
        });
        if (!ok) return;
        var r = await P.client().from('devices').delete().eq('id', b.dataset.drop);
        flash(r.error ? 'Could not disconnect: ' + r.error.message : 'Phone disconnected');
        paint();
      });
    });
  }

  /* Send the code to Bryan's inbox with the steps beside it — easier than
     reading eight characters down the phone, and he can do it on his own. */
  async function emailCode() {
    var btn = document.getElementById('email-code');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      var cfg = window.WAINWRIGHTS_SUPABASE;
      var session = (await P.client().auth.getSession()).data.session;
      var res = await fetch(cfg.url + '/functions/v1/mydid/email-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token }
      });
      var j = await res.json();
      if (!res.ok || j.error) throw new Error(j.error || 'That did not send.');
      showCode(j.code);
      flash(j.emailed ? 'Sent — the code is in the inbox' : 'Made a code, but the email did not send');
    } catch (e) {
      flash('Could not send that: ' + e.message);
    }
    btn.disabled = false; btn.textContent = 'Email it to Bryan';
  }

  async function getCode() {
    var btn = document.getElementById('get-code');
    btn.disabled = true;
    var r = await P.client().rpc('create_pairing_code');
    btn.disabled = false;
    if (r.error) return flash('Could not make a code: ' + r.error.message);

    showCode(r.data);
    btn.textContent = 'Get a new code';

    countdown();
  }

  function showCode(code) {
    var box = document.getElementById('code-box');
    box.innerHTML = '<div class="pair-code" aria-live="polite"><span class="pair-code-value">' + P.esc(code) + '</span>' +
                    '<span class="pair-code-left" id="code-left"></span></div>';
    countdown();
  }

  function countdown() {
    var box = document.getElementById('code-box');
    var until = Date.now() + 10 * 60 * 1000;
    clearInterval(timer);
    var tick = function () {
      var left = Math.max(0, Math.round((until - Date.now()) / 1000));
      var el = document.getElementById('code-left');
      if (!el) return clearInterval(timer);
      if (!left) {
        clearInterval(timer);
        box.innerHTML = '<p class="form-note" style="text-align:left">That code has expired. Get a new one when the phone is ready.</p>';
        return;
      }
      el.textContent = 'Expires in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      // Every few seconds, see whether the phone has used the code yet.
      if (left % 4 === 0) {
        P.client().from('devices').select('id').then(function (r) {
          if (r.data && r.data.length > known) {
            clearInterval(timer);
            flash('Phone connected');
            paint();
          }
        });
      }
    };
    tick(); timer = setInterval(tick, 1000);
  }

  (async function () {
    var session = await P.requireSession('../portal/login.html');
    if (!session) return;
    var profile = await P.profile();
    if (!profile || !profile.is_admin) {
      root.innerHTML = '<div class="portal-empty"><h2>This page is Bryan’s</h2>' +
        '<p>Your account does not have admin access.</p>' +
        '<a class="btn btn-outline" href="../portal/index.html">Your own jobs</a></div>';
      return;
    }
    paint();
  })();
})();
</script>
</body>
</html>
