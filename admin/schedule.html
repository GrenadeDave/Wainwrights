<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule — Wainwright’s admin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=d13960a6">
<link rel="stylesheet" href="../assets/css/portal.css?v=850b5e35">
</head>
<body class="portal-body">

<header class="site-header portal-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../assets/img/logo-badge-dark-256.png" width="256" height="256" alt="">
      <span class="brand-text"><span class="brand-name">Wainwright’s</span><span class="brand-sub">Schedule</span></span>
    </a>
    <div class="who who--admin">
      <a class="plain" href="index.html">Job board</a>
      <a class="plain" href="mydid.html">MyDiD</a>
      <a class="plain" href="reviews.html">Reviews</a>
      <a class="plain" href="team.html">Admins</a>
      <a class="plain" href="#" id="signout">Sign out</a>
    </div>
  </div>
</header>

<main class="portal-main">
  <div class="wrap" id="root">
    <p style="color:var(--muted)">Loading the schedule&hellip;</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="../assets/js/config.js?v=82fdb64d"></script>
<script src="../assets/js/rates.js?v=4b364822"></script>
<script src="../assets/js/schedule.js?v=3041262f"></script>
<script src="../assets/js/supabase-config.js?v=79cace19"></script>
<script src="../assets/js/portal.js?v=d592444e"></script>
<script src="../assets/js/portal-demo.js?v=1f93f340"></script>
<script src="../assets/js/site.js?v=31d48d51"></script>
<script>
(function () {
  'use strict';
  var P = window.WPortal;
  var S = window.WAINWRIGHTS_SCHEDULE;
  var root  = document.getElementById('root');
  var toast = document.getElementById('toast');

  if (!P.ready()) { root.innerHTML = P.notConfiguredHtml(); return; }

  /* The tour copy of this page swaps Sign out for "Leave the tour", so the
     button is not always here. */
  var signout = document.getElementById('signout');
  if (signout) signout.addEventListener('click', async function (e) {
    e.preventDefault();
    await P.signOut();
    window.location.replace('../portal/login.html');
  });

  /* On a Saturday or Sunday the week just gone is no use — open on the coming one. */
  function thisWorkWeek() {
    var d = new Date();
    if (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 2);
    return startOfWeek(d);
  }
  var weekStart = thisWorkWeek();
  var jobs = [], blackouts = [];

  /* Week or month. Remembered on this device only. */
  var view = 'week';
  try { if (localStorage.getItem('w-schedule-view') === 'month') view = 'month'; } catch (e) {}
  var monthStart = (function () { var d = new Date(); d.setHours(0,0,0,0); d.setDate(1); return d; })();
  var picked = null;                       // the day open under the month grid

  function startOfWeek(d) {
    var x = new Date(d); x.setHours(0,0,0,0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));   // Monday
    return x;
  }
  function flash(m) {
    toast.textContent = m; toast.classList.add('is-up');
    setTimeout(function(){ toast.classList.remove('is-up'); }, 2600);
  }

  function weekDays() {
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(weekStart); d.setDate(d.getDate() + i);
      if (S.isWorkingDay(d)) out.push(S.ymd(d));
    }
    return out;
  }

  /* The month grid runs Monday to Sunday, so it starts before the 1st and ends after the last day. */
  function monthDays() {
    var first = startOfWeek(monthStart);
    var last = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0);
    last.setDate(last.getDate() + (7 - ((last.getDay() + 6) % 7) - 1));
    var out = [];
    for (var d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) out.push(S.ymd(d));
    return out;
  }

  async function load() {
    var days = view === 'month' ? monthDays() : weekDays();
    if (!days.length) return;
    var res = await Promise.all([
      P.client().from('jobs').select('*')
        .gte('scheduled_for', days[0]).lte('scheduled_for', days[days.length-1])
        .not('slot_start', 'is', null)
        .order('slot_start'),
      P.client().from('blackouts').select('*')
        .gte('day', days[0]).lte('day', days[days.length-1])
    ]);
    if (res[0].error) { root.innerHTML = '<div class="portal-empty"><h2>Could not load</h2><p>'+P.esc(res[0].error.message)+'</p></div>'; return; }
    /* A cancelled job keeps its old date; it is not work, so it is not drawn. */
    jobs = (res[0].data || []).filter(function (j) { return j.status !== 'cancelled'; });
    blackouts = (res[1].data || []).map(function(b){ return b.day; });

    /* Notes are in the admin-only job_notes table; fetch them for this week's
       jobs so the MyDiD export can carry them. */
    if (jobs.length) {
      var ids = jobs.map(function (j) { return j.id; });
      var nr = await P.client().from('job_notes').select('job_id, body').in('job_id', ids);
      var byId = {};
      (nr.data || []).forEach(function (n) { byId[n.job_id] = n.body; });
      jobs.forEach(function (j) { j.admin_notes = byId[j.id] || ''; });
    }
    if (view === 'month') paintMonth(); else paint();
  }

  function switcher() {
    return '<div class="seg" role="group" aria-label="Show">' +
      '<button type="button" class="seg-b" data-view="week" aria-pressed="' + (view === 'week') + '">Week</button>' +
      '<button type="button" class="seg-b" data-view="month" aria-pressed="' + (view === 'month') + '">Month</button>' +
    '</div>';
  }
  function wireSwitcher() {
    root.querySelectorAll('[data-view]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.view === view) return;
        view = b.dataset.view;
        try { localStorage.setItem('w-schedule-view', view); } catch (e) {}
        if (view === 'month') { monthStart = new Date(weekStart); monthStart.setDate(1); picked = null; }
        load();
      });
    });
  }

  async function toggleBlock(day) {
    var off = blackouts.indexOf(day) !== -1;
    var res = off
      ? await P.client().from('blackouts').delete().eq('day', day)
      : await P.client().from('blackouts').insert({ day: day });
    if (res.error) return flash('Could not change that: ' + res.error.message);
    flash(off ? 'Day opened back up' : 'Day blocked out');
    load();
  }

  function span(j) {
    var a = S.slots[j.slot_start] || S.slots[0];
    var z = S.slots[Math.min(j.slot_start + (j.slots_needed || 1) - 1, S.slots.length - 1)] || a;
    return a.time.split('\u2013')[0].trim() + ' \u2013 ' + z.time.split('\u2013')[1].trim();
  }
  var STATUS = { scheduled: 'Scheduled', in_progress: 'In progress', completed: 'Done', quoted: 'Estimate accepted' };

  /* ----------------------------------------------------------------------
     The month: every booked job at a glance, a day's detail underneath.
     ---------------------------------------------------------------------- */
  function paintMonth() {
    var days = monthDays();
    var today = S.ymd(new Date());
    var month = monthStart.getMonth();
    var inMonth = jobs.filter(function (j) { return S.parseYmd(j.scheduled_for).getMonth() === month; });
    var byDay = {};
    jobs.forEach(function (j) { (byDay[j.scheduled_for] = byDay[j.scheduled_for] || []).push(j); });
    Object.keys(byDay).forEach(function (k) { byDay[k].sort(function (a, b) { return a.slot_start - b.slot_start; }); });

    if (!picked || S.parseYmd(picked).getMonth() !== month) {
      var firstJob = inMonth.map(function (j) { return j.scheduled_for; }).sort()[0];
      picked = S.parseYmd(today).getMonth() === month && S.parseYmd(today).getFullYear() === monthStart.getFullYear()
        ? today : (firstJob || S.ymd(monthStart));
    }

    var title = monthStart.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    var head = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) {
      return '<div class="mo-dow">' + d + '</div>';
    }).join('');

    var cells = days.map(function (day) {
      var d = S.parseYmd(day), list = byDay[day] || [];
      var off = blackouts.indexOf(day) !== -1;
      var cls = 'mo-day' + (d.getMonth() !== month ? ' is-other' : '') + (S.isWorkingDay(d) ? '' : ' is-weekend') +
                (off ? ' is-off' : '') + (day === today ? ' is-today' : '') + (day === picked ? ' is-picked' : '');
      var chips = list.slice(0, 3).map(function (j) {
        return '<a class="mo-job is-' + P.esc(j.status) + '" href="job.html?id=' + encodeURIComponent(j.id) + '" title="' +
          P.esc(j.contact_name + ' \u2014 ' + j.service + ', ' + span(j)) + '">' +
          '<span class="mo-t">' + P.esc((S.slots[j.slot_start] || {}).label || '') + '</span> ' + P.esc(j.contact_name) + '</a>';
      }).join('');
      var more = list.length > 3 ? '<span class="mo-more">+' + (list.length - 3) + ' more</span>' : '';
      var dots = list.map(function (j) { return '<i class="mo-dot is-' + P.esc(j.status) + '"></i>'; }).join('');
      return '<div class="' + cls + '" data-day="' + day + '" role="button" tabindex="0" aria-label="' +
          P.esc(d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })) + ', ' +
          (off ? 'blocked out' : list.length + (list.length === 1 ? ' job' : ' jobs')) + '">' +
        '<span class="mo-n">' + d.getDate() + '</span>' +
        (off ? '<span class="mo-off">Off</span>' : '') +
        '<div class="mo-chips">' + chips + more + '</div>' +
        '<div class="mo-dots" aria-hidden="true">' + dots + '</div>' +
      '</div>';
    }).join('');

    /* The picked day, in full. */
    var pd = S.parseYmd(picked), plist = byDay[picked] || [], poff = blackouts.indexOf(picked) !== -1;
    var detail = '<div class="mo-detail panel-card">' +
      '<div class="mo-detail-head"><h2 class="p-h2" style="margin:0">' +
        P.esc(pd.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })) + '</h2>' +
        '<button class="wk-block" id="mo-block" type="button">' + (poff ? 'Open it up' : 'Block the day') + '</button></div>' +
      (poff ? '<p style="color:var(--muted);margin:10px 0 0">Blocked out \u2014 not working.</p>' : '') +
      (plist.length ? plist.map(function (j) {
        return '<a class="mo-item is-' + P.esc(j.status) + '" href="job.html?id=' + encodeURIComponent(j.id) + '">' +
          '<span class="mo-item-when">' + P.esc(span(j)) + '</span>' +
          '<b>' + P.esc(j.contact_name) + '</b>' +
          '<span>' + P.esc(j.service) + (j.address ? ' \u00b7 ' + P.esc(String(j.address).split(',')[0]) : '') + '</span>' +
          '<span class="mo-item-status">' + P.esc(STATUS[j.status] || j.status) + '</span>' +
        '</a>';
      }).join('') : (poff ? '' : '<p style="color:var(--muted);margin:10px 0 0">Nothing booked.</p>')) +
    '</div>';

    root.innerHTML =
      '<div class="portal-title"><h1>Schedule</h1><p>' + P.esc(title) + ' \u00b7 ' +
        inMonth.length + (inMonth.length === 1 ? ' job booked' : ' jobs booked') + '</p></div>' +
      '<div class="wk-bar">' + switcher() +
        '<div class="wk-nav">' +
          '<button class="chip" id="prev" type="button" aria-label="The month before">&larr;</button>' +
          '<button class="chip" id="today" type="button">This month</button>' +
          '<button class="chip" id="next" type="button" aria-label="The month after">&rarr;</button>' +
        '</div>' +
      '</div>' +
      '<div class="mo-legend" aria-hidden="true"><span><i class="mo-dot is-scheduled"></i>Scheduled</span>' +
        '<span><i class="mo-dot is-in_progress"></i>In progress</span><span><i class="mo-dot is-completed"></i>Done</span>' +
        '<span><i class="mo-key-off"></i>Blocked out</span></div>' +
      '<div class="mo">' + head + cells + '</div>' +
      detail;

    wireSwitcher();
    document.getElementById('prev').addEventListener('click', function () { monthStart.setMonth(monthStart.getMonth() - 1); load(); });
    document.getElementById('next').addEventListener('click', function () { monthStart.setMonth(monthStart.getMonth() + 1); load(); });
    document.getElementById('today').addEventListener('click', function () {
      monthStart = new Date(); monthStart.setHours(0,0,0,0); monthStart.setDate(1); picked = null; load();
    });
    document.getElementById('mo-block').addEventListener('click', function () { toggleBlock(picked); });
    root.querySelectorAll('.mo-day').forEach(function (c) {
      function pick(e) {
        if (e.target.closest('a')) return;                   // a job chip opens the job
        var d = S.parseYmd(c.dataset.day);
        if (d.getMonth() !== month) { monthStart = new Date(d.getFullYear(), d.getMonth(), 1); }
        picked = c.dataset.day;
        if (d.getMonth() !== month) load(); else paintMonth();
      }
      c.addEventListener('click', pick);
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); } });
    });
  }

  /* A job occupies its start slot and the ones after it. */
  function jobAt(day, slot) {
    return jobs.filter(function (j) {
      return j.scheduled_for === day &&
             slot >= j.slot_start && slot < j.slot_start + j.slots_needed;
    })[0];
  }

  function paint() {
    var days = weekDays();
    var label = S.parseYmd(days[0]).toLocaleDateString('en-US', { month:'long', day:'numeric' }) +
                ' – ' +
                S.parseYmd(days[days.length-1]).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

    var booked = jobs.length;

    var today = S.ymd(new Date());

    /* The week, as a real week: one row per slot, one column per day, and a
       job that runs two slots drawn as one tall block rather than a cell
       saying "continues" under it. */
    var grid =
      '<div class="wk">' +
        '<div class="wk-times" aria-hidden="true">' +
          '<div class="wk-times-head"></div>' +
          S.slots.map(function (s) {
            return '<div class="wk-time"><b>' + P.esc(s.label) + '</b><span>' + P.esc(s.time) + '</span></div>';
          }).join('') +
        '</div>' +

        days.map(function (day) {
          var off  = blackouts.indexOf(day) !== -1;
          var d    = S.parseYmd(day);
          var isToday = day === today;
          var cells = '';

          if (off) {
            cells = '<div class="wk-cell is-blocked" style="grid-row: span ' + S.slots.length + '">' +
                      '<span>Not working</span></div>';
          } else {
            for (var n = 0; n < S.slots.length; n++) {
              var s = S.slots[n], j = jobAt(day, s.key);
              if (!j) {
                cells += '<div class="wk-cell is-free"><span class="wk-free">Free</span>' +
                         '<span class="wk-when">' + P.esc(s.time) + '</span></div>';
                continue;
              }
              if (j.slot_start !== s.key) continue;          // drawn by the block above
              var runs = Math.min(j.slots_needed || 1, S.slots.length - n);
              var last = S.slots[n + runs - 1];
              var span = runs > 1 ? ' style="grid-row: span ' + runs + '"' : '';
              cells += '<a class="wk-cell is-job is-' + P.esc(j.status || 'scheduled') + '"' + span +
                         ' href="job.html?id=' + encodeURIComponent(j.id) + '">' +
                '<b>' + P.esc(j.contact_name) + '</b>' +
                '<span class="wk-what">' + P.esc(j.service) + '</span>' +
                (j.address ? '<span class="wk-where">' + P.esc(String(j.address).split(',')[0]) + '</span>' : '') +
                '<span class="wk-when">' + P.esc(s.time.split('\u2013')[0].trim()) + ' \u2013 ' +
                  P.esc(last.time.split('\u2013')[1].trim()) + '</span>' +
              '</a>';
            }
          }

          return '<div class="wk-day' + (off ? ' is-off' : '') + (isToday ? ' is-today' : '') + '">' +
            '<div class="wk-head">' +
              '<div><b>' + d.toLocaleDateString('en-US', { weekday: 'long' }) + '</b>' +
              '<span>' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
              (isToday ? ' \u00b7 today' : '') + '</span></div>' +
              '<button class="wk-block" data-day="' + day + '" type="button" title="' +
                (off ? 'Open this day back up' : 'Mark yourself unavailable all day') + '">' +
                (off ? 'Open it up' : 'Block the day') + '</button>' +
            '</div>' + cells +
          '</div>';
        }).join('') +
      '</div>';

    var html =
      '<div class="portal-title"><h1>Schedule</h1><p>' + P.esc(label) + ' \u00b7 ' +
        booked + (booked === 1 ? ' job booked' : ' jobs booked') + '</p></div>' +

      '<div class="wk-bar">' + switcher() +
        '<div class="wk-nav">' +
          '<button class="chip" id="prev" type="button" aria-label="The week before">&larr;</button>' +
          '<button class="chip" id="today" type="button">This week</button>' +
          '<button class="chip" id="next" type="button" aria-label="The week after">&rarr;</button>' +
        '</div>' +
        /* The tour is public. Handing Bryan's week to MyDiD is his to do, not
           something to leave on screen for whoever wanders in. */
        (P.demo ? '' :
          '<button class="chip chip--go" id="export" type="button">Export for MyDiD</button>') +
      '</div>' +

      grid +

      (booked ? '' :
        '<div class="wk-none"><b>Nothing booked this week.</b>' +
        '<span>Quotes the customer has accepted show up here once you give them a day and a time.</span></div>');
    root.innerHTML = html;

    document.getElementById('prev').addEventListener('click', function(){ weekStart.setDate(weekStart.getDate()-7); load(); });
    document.getElementById('next').addEventListener('click', function(){ weekStart.setDate(weekStart.getDate()+7); load(); });
    document.getElementById('today').addEventListener('click', function(){ weekStart = thisWorkWeek(); load(); });
    var exportBtn = document.getElementById('export');
    if (exportBtn) exportBtn.addEventListener('click', exportMydid);
    wireSwitcher();

    root.querySelectorAll('.wk-block').forEach(function (b) {
      b.addEventListener('click', function () { toggleBlock(b.dataset.day); });
    });
  }

  /* ----------------------------------------------------------------------
     Export this week for MyDiD.

     MyDiD has no server and never will, so nothing is pushed to it. This
     writes the CSV that MyDiD's customer import reads, with the schedule in
     the notes so Bryan has the time and the job detail on his phone.
     See LINKING-TO-MYDID.md.
     ---------------------------------------------------------------------- */
  function csvField(v) {
    return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  }

  function exportMydid() {
    var rows = jobs.slice().sort(function (a, b) {
      return a.scheduled_for === b.scheduled_for
        ? a.slot_start - b.slot_start
        : a.scheduled_for < b.scheduled_for ? -1 : 1;
    });

    if (!rows.length) return flash('Nothing booked this week to export');

    var out = ['name,phone,email,address,notes'];
    rows.forEach(function (j) {
      var when = S.prettyDate(j.scheduled_for) + ', ' + S.slotLabel(j.slot_start) +
                 (j.slots_needed > 1 ? ' (' + j.slots_needed + ' slots)' : '');
      var total = P.total(j);
      var notes = [
        j.service,
        when,
        j.details || '',
        total != null ? 'Quoted ' + P.money(total) : 'No price yet',
        j.admin_notes || ''
      ].filter(Boolean).join(' | ');
      out.push([j.contact_name, j.contact_phone, j.contact_email, j.address, notes]
        .map(csvField).join(','));
    });

    var text = out.join('\n');
    var name = 'wainwrights-' + S.ymd(weekStart) + '-for-mydid.csv';

    /* Offer the file, and also drop it on the clipboard — pasting is far
       easier than finding a download on an Android phone. */
    try {
      var blob = new Blob([text], { type: 'text/csv' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    } catch (e) { /* fall through to the clipboard */ }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function(){ flash(rows.length + ' jobs exported — also copied, ready to paste into MyDiD'); },
        function(){ flash(rows.length + ' jobs exported'); }
      );
    } else {
      flash(rows.length + ' jobs exported');
    }
  }

  (async function () {
    var session = await P.requireSession('../portal/login.html');
    if (!session) return;
    var profile = await P.profile();
    if (!profile || !profile.is_admin) {
      root.innerHTML = '<div class="portal-empty"><h2>This page is Bryan’s</h2>' +
        '<p>Your account does not have admin access.</p>' +
        '<a class="btn btn-outline" href="../portal/index.html">Your own jobs</a></div>';
      return;
    }
    load();
  })();
})();
</script>
</body>
</html>
