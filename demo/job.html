<script>
(function () {
  'use strict';
  var P = window.WPortal;
  var R = window.WAINWRIGHTS_RATES;
  var S = window.WAINWRIGHTS_SCHEDULE;
  var root  = document.getElementById('root');
  var toast = document.getElementById('toast');

  /* The tour copy of this page swaps Sign out for "Leave the tour", so the
     button is not always here. */
  var signout = document.getElementById('signout');
  if (signout) signout.addEventListener('click', async function (e) {
    e.preventDefault();
    await P.signOut();
    window.location.replace('../portal/login.html');
  });

  var id = new URLSearchParams(window.location.search).get('id');
  var job = null;

  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('is-up');
    setTimeout(function () { toast.classList.remove('is-up'); }, 2600);
  }

  /* Dollars typed in a box → integer cents, without float drift.
     Returns null for an empty box, NaN for nonsense. */
  function toCents(text) {
    var t = String(text == null ? '' : text).replace(/[$,\s]/g, '').trim();
    if (t === '') return null;
    if (!/^\d+(\.\d{0,2})?$/.test(t)) return NaN;
    var parts = t.split('.');
    var whole = parseInt(parts[0], 10);
    var frac  = parts[1] ? (parts[1] + '00').slice(0, 2) : '00';
    return whole * 100 + parseInt(frac, 10);
  }

  function dollars(cents) {
    return cents == null ? '' : (cents / 100).toFixed(2);
  }

  async function reload() {
    var res = await P.client().from('jobs').select('*').eq('id', id).maybeSingle();
    if (res.error || !res.data) {
      root.innerHTML = '<div class="portal-empty"><h2>Job not found</h2>' +
        '<a class="btn btn-outline" href="index.html">Back to the board</a></div>';
      return false;
    }
    job = res.data;
    /* Private notes live in their own admin-only table, so that no policy on
       `jobs` can ever expose them to the customer. */
    var n = await P.client().from('job_notes').select('body').eq('job_id', id).maybeSingle();
    job.admin_notes = (n.data && n.data.body) || '';
    return true;
  }

  function paint(events) {
    var total = P.total(job);
    /* 'cancelled' is deliberately NOT in this list. Turning someone down
       means telling them why, so it has its own button and its own box at the
       bottom of this card — not a value that can be picked by mistake on the
       way to something else. A job that IS cancelled still shows as such. */
    var picks = P.ORDER.slice();
    if (job.status === 'cancelled') picks.push('cancelled');
    var statusOptions = picks.map(function (k) {
      return '<option value="' + k + '"' + (k === job.status ? ' selected' : '') + '>' +
             P.STATUS[k].label + '</option>';
    }).join('');

    var cancelled = job.status === 'cancelled';
    var theirEmail = (job.contact_email || '').trim();
    var firstName = String(job.contact_name || 'They').trim().split(/\s+/)[0];

    root.innerHTML =
      '<p class="crumbs-p">' +
        '<a href="index.html" style="color:var(--moss-600)">Job board</a> &rsaquo; ' +
        P.esc(job.contact_name) +
      '</p>' +
      '<div class="portal-title">' +
        '<h1>' + P.esc(job.contact_name) + '</h1>' +
        '<p>' + P.esc(job.service) + ' &middot; asked ' + P.esc(P.dateTime(job.created_at) || '') + '</p>' +
        P.started(job) +
      '</div>' +

      (job.quote_accepted_at && job.status === 'quoted'
        ? '<div class="panel-card panel-card--ok" style="margin-bottom:18px"><h2>They said go ahead</h2>' +
          '<p style="margin:0">Accepted ' + P.esc(P.dateTime(job.quote_accepted_at) || '') +
          '. Pick a day below and set the status to Scheduled.</p></div>' : '') +

      '<div class="admin-grid">' +
        '<div>' +

          '<div class="panel-card">' +
            '<h2>What they asked for</h2>' +
            '<dl class="kv">' +
              '<dt>Phone</dt><dd><a href="tel:' + P.esc((job.contact_phone||'').replace(/[^\d+]/g,'')) + '">' +
                P.esc(job.contact_phone || '—') + '</a></dd>' +
              '<dt>Email</dt><dd><a href="mailto:' + P.esc(job.contact_email) + '">' + P.esc(job.contact_email) + '</a></dd>' +
              (job.address ? '<dt>Property</dt><dd>' + P.esc(job.address) + '</dd>' : '') +
              (job.contact_time ? '<dt>Best time</dt><dd>' + P.esc(job.contact_time) + '</dd>' : '') +
              (job.requested_day
                 ? '<dt>Asked for</dt><dd>' + P.esc(S.prettyDate(job.requested_day)) +
                   (job.requested_slot != null
                      ? '<br><span style="font-weight:500;color:var(--muted)">' +
                        P.esc(S.slotLabel(job.requested_slot)) + '</span>' : '') + '</dd>'
                 : '') +
              (job.wants_hauling
                 ? '<dt>Junk hauling?</dt><dd>' +
                   P.esc({ yes: 'Would use it', maybe: 'Maybe some day', no: 'Would not use it' }[job.wants_hauling] || job.wants_hauling) +
                   '</dd>'
                 : '') +
              '<dt>Account</dt><dd>' + (job.customer_id
                 ? 'Signed up — can see this in the portal'
                 : '<span style="color:var(--muted);font-weight:500">Not signed up yet. Claimed automatically when they sign in with this email.</span>') + '</dd>' +
            '</dl>' +
            (job.details ?
              '<p class="mini-label" style="margin-top:22px">Their description</p>' +
              '<p style="white-space:pre-wrap;margin:0">' + P.esc(job.details) + '</p>' : '') +
            '<div class="btn-row" style="margin-top:22px">' +
              '<a class="btn btn-moss" href="tel:' + P.esc((job.contact_phone||'').replace(/[^\d+]/g,'')) + '">Call them</a>' +
              '<a class="btn btn-outline" href="mailto:' + P.esc(job.contact_email) + '">Email them</a>' +
            '</div>' +
          '</div>' +

          '<div class="panel-card">' +
            '<h2>Private notes</h2>' +
            '<p class="form-note" style="text-align:left;margin:0 0 12px">Only you see these. The customer never does.</p>' +
            '<div class="field" style="margin-bottom:12px">' +
              '<textarea id="admin-notes" placeholder="Access is tight, bring the small trailer…">' +
                P.esc(job.admin_notes || '') + '</textarea>' +
            '</div>' +
            '<button class="btn btn-outline" id="save-notes">Save notes</button>' +
          '</div>' +

          (events && events.length ?
            '<div class="panel-card">' +
              '<h2>History</h2>' +
              '<ul class="timeline">' + events.map(function (e) {
                var lbl = e.status && P.STATUS[e.status] ? P.STATUS[e.status].label
                        : e.author === 'customer' ? 'Customer' : e.author === 'bryan' ? 'You' : 'Update';
                return '<li><div class="t-when">' + P.esc(P.dateTime(e.created_at) || '') + '</div>' +
                  '<div class="t-what">' + P.esc(lbl) + '</div>' +
                  (e.note ? '<div class="t-note">' + P.esc(e.note) + '</div>' : '') + '</li>';
              }).join('') + '</ul>' +
            '</div>' : '') +

        '</div>' +

        '<div>' +
          '<div class="panel-card">' +
            '<h2>Update the job</h2>' +

            '<div class="field">' +
              '<label for="status">Status</label>' +
              '<select id="status">' + statusOptions + '</select>' +
            '</div>' +

            '<div class="field">' +
              '<label for="quote">Price <span class="hint">(dollars)</span></label>' +
              '<input type="text" id="quote" inputmode="decimal" placeholder="0.00" value="' +
                P.esc(dollars(job.quote_cents)) + '">' +
            '</div>' +

            '<div class="field">' +
              '<label for="surcharge">Disposal &amp; handling <span class="hint">(dollars)</span></label>' +
              '<input type="text" id="surcharge" inputmode="decimal" placeholder="0.00" value="' +
                P.esc(dollars(job.surcharge_cents || 0)) + '">' +
              '<p class="form-note" style="text-align:left;margin-top:8px" id="surcharge-hint"></p>' +
            '</div>' +

            '<div class="field">' +
              '<label for="scheduled">Date</label>' +
              '<input type="date" id="scheduled" value="' + P.esc(job.scheduled_for || '') + '">' +
              (job.requested_day
                 ? '<p class="form-note" style="text-align:left;margin-top:8px">' +
                   'They asked for <b>' + P.esc(S.prettyDate(job.requested_day)) + '</b>. ' +
                   '<button type="button" class="linkish" id="use-requested">Use that</button></p>'
                 : '') +
            '</div>' +

            '<div class="field-2">' +
              '<div class="field" style="margin:0">' +
                '<label for="slot-start">Start slot</label>' +
                '<select id="slot-start">' +
                  '<option value="">Not set</option>' +
                  S.slots.map(function (s) {
                    return '<option value="' + s.key + '"' +
                           (job.slot_start === s.key ? ' selected' : '') + '>' +

                  }).join('') +
                '</select>' +
              '</div>' +
              '<div class="field" style="margin:0">' +
                '<label for="slots-needed">Slots <span class="hint">(3 hrs each)</span></label>' +
                '<select id="slots-needed">' +
                  [1,2,3].map(function (n) {
                    return '<option value="' + n + '"' +
                           ((job.slots_needed || 1) === n ? ' selected' : '') + '>' +
                           n + (n === 1 ? ' slot' : ' slots') + ' \u2014 ' + S.scopeNote[n] + '</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
            '</div>' +
            '<label class="check-row" style="display:flex;gap:10px;align-items:center;margin:0 0 12px;font-weight:600">' +
              '<input type="checkbox" id="multi"' + (S.isMultiDay(job) ? ' checked' : '') + '> Runs over several days</label>' +
            '<div id="multi-box"' + (S.isMultiDay(job) ? '' : ' hidden') + '>' +
              '<div class="field-2">' +
                '<div class="field" style="margin:0">' +
                  '<label for="through">Last day</label>' +
                  '<input type="date" id="through" value="' + P.esc(job.scheduled_through || '') + '">' +
                '</div>' +
                '<div class="field" style="margin:0">' +
                  '<label for="through-slot">Finishes</label>' +
                  '<select id="through-slot">' +
                    S.slots.map(function (s) {
                      var sel = (job.through_slot == null ? 2 : job.through_slot) === s.key;
                      return '<option value="' + s.key + '"' + (sel ? ' selected' : '') + '>By ' +
                             s.time.split('\u2013')[1].trim().replace(':00', '') + '</option>';
                    }).join('') +
                  '</select>' +
                '</div>' +
              '</div>' +
              '<p class="form-note" style="text-align:left;margin:10px 0 0;padding:10px 12px;border-radius:10px;' +
                'background:var(--amber-050);color:var(--ink)"><b>Check the limit.</b> A job over several days must still ' +
                'total <b>less than $1,000</b> for labour, materials and everything else, and need no permit. ' +
                'Bigger than that, it goes to a licensed contractor \u2014 the website will not save it. ' +
                'Weekends and blocked days in between are not worked.</p>' +
            '</div>' +
            '<p class="form-note" style="text-align:left;margin:12px 0 20px" id="slot-echo"></p>' +

            '<div class="field">' +
              '<label for="note">Note for the customer <span class="hint">(optional)</span></label>' +
              '<textarea id="note" style="min-height:90px" placeholder="Came out today — need to bring the chipper back Thursday."></textarea>' +
              '<p class="form-note" style="text-align:left;margin-top:8px">This appears on their timeline. Leave blank for no message.</p>' +
            '</div>' +

            '<button class="btn btn-primary btn-block" id="save">Save changes</button>' +
            '<div class="form-status" id="save-status" role="status"></div>' +

            /* Turning the job down. Separated from everything above by a rule,
               because it sends an email the moment it is pressed. */
            '<div class="turn-down">' +
              (cancelled
                ? '<span class="mini-label">Turned down</span>' +
                  '<p class="td-when">' + P.esc(P.dateTime(job.cancelled_at) || '') +
                    (job.cancelled_by === 'customer' ? ' \u2014 by the customer' : '') + '</p>' +
                  (job.cancel_reason
                    ? '<p class="td-why">' + P.esc(job.cancel_reason) + '</p>' +
                      '<p class="form-note" style="text-align:left;margin:10px 0 0">' +
                      'They were sent this, word for word. Changing it now would not reach them \u2014 ' +
                      'ring them instead.</p>'
                    : '<p class="form-note" style="text-align:left;margin:0">No reason was recorded.</p>')
                : '<button type="button" class="linkish td-open" id="cancel-open">' +
                    'Turn this request down\u2026</button>' +
                  '<div class="td-box" id="cancel-box" hidden>' +
                    '<h3>Turn this request down</h3>' +
                    (theirEmail
                      ? '<p>' + P.esc(firstName) + ' will be emailed, and will see exactly what you ' +
                        'write here. Write it the way you would say it on the phone.</p>'
                      : '<p class="td-noemail"><b>There is no email address on this request.</b> ' +
                        'It will still be cancelled and the reason written down, but nobody will be ' +
                        'told \u2014 ring them on ' + P.esc(job.contact_phone || 'the number they gave') +
                        '.</p>') +
                    '<div class="td-quick">' +
                      ['Booked solid until the end of the month \u2014 I did not want to leave you waiting on me.',
                       'This one is outside the area I cover.',
                       'This is not work I take on, and you would be better off with someone who does it every day.']
                        .map(function (r, n) {
                          return '<button type="button" class="chip-mini" data-why="' + n + '">' +
                            P.esc(['Booked solid', 'Outside my area', 'Not work I take on'][n]) + '</button>';
                        }).join('') +
                    '</div>' +
                    '<div class="field">' +
                      '<label class="sr-only" for="cancel-why">Reason</label>' +
                      '<textarea id="cancel-why" maxlength="1000" style="min-height:104px" ' +
                        'placeholder="Why can you not take this one?"></textarea>' +
                      '<p class="form-note" style="text-align:left;margin-top:8px" id="cancel-count"></p>' +
                    '</div>' +
                    '<div class="btn-row">' +
                      '<button type="button" class="btn btn-dark" id="cancel-do">' +
                        (theirEmail ? 'Cancel it and tell them' : 'Cancel it') + '</button>' +
                      '<button type="button" class="btn btn-outline" id="cancel-back">Keep it</button>' +
                    '</div>' +
                    '<div class="form-status" id="cancel-status" role="status"></div>' +
                  '</div>') +
            '</div>' +

            '<div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)">' +
              '<span class="mini-label">Total the customer sees</span>' +
              '<div class="price-row total" style="border:0;padding-top:4px">' +
                '<span class="label">Total</span>' +
                '<span class="amount" id="live-total">' + (total != null ? P.money(total) : '—') + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="panel-card">' +
            '<span class="mini-label">Customer view</span>' +
            '<p style="font-size:.9375rem;color:var(--muted);margin:0 0 14px">' +
              'Exactly what they see for this job.</p>' +
            P.track(job.status) +
          '</div>' +
        '</div>' +
      '</div>';

    wire();
  }

  /* Live, this goes through the cancel-request function: it runs the database
     function as Bryan (which is what actually decides whether he may), then
     emails the customer. In the tour there is no server, so the demo client
     answers instead and nothing is sent anywhere. */
  /* After a save, the other admins' phones hear about it (MyDiD shared schedule).
     Best effort: a missed alert never undoes a save, and the tour sends nothing. */
  async function tellPhones(jobId, verb) {
    if (P.demo) return;
    try {
      var cfg = window.WAINWRIGHTS_SUPABASE;
      var session = (await P.client().auth.getSession()).data.session;
      if (!session) return;
      fetch(cfg.url + '/functions/v1/mydid/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ id: jobId, verb: verb })
      }).catch(function () {});
    } catch (e) { /* never in the way of a save */ }
  }

  async function cancelJob(jobId, reason) {
    if (P.demo) {
      var d = await P.client().rpc('admin_cancel_job', { p_job: jobId, p_reason: reason });
      if (d.error) return { error: d.error.message };
      return { emailed: true, note: 'Nothing was really sent \u2014 this is the tour.' };
    }
    try {
      var cfg = window.WAINWRIGHTS_SUPABASE;
      var session = (await P.client().auth.getSession()).data.session;
      if (!session) return { error: 'Your sign-in has expired. Sign in again and try that once more.' };
      var res = await fetch(cfg.url + '/functions/v1/cancel-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ jobId: jobId, reason: reason })
      });
      var j = await res.json();
      if (!res.ok || j.error) return { error: j.error || 'That did not go through.' };
      return j;
    } catch (e) {
      return { error: 'That did not go through: ' + e.message };
    }
  }

  function wire() {
    var quote     = document.getElementById('quote');
    var surcharge = document.getElementById('surcharge');
    var liveTotal = document.getElementById('live-total');
    var hint      = document.getElementById('surcharge-hint');

    /* Nudge toward the standard junk fee, without forcing it. */
    var junk = R.services && R.services.junk && R.services.junk.surcharge;
    if (junk && /junk|haul|debris/i.test(job.service)) {
      hint.innerHTML = 'Usual for hauling: <b>' + R.from(junk.amount) + '</b> — ' + P.esc(junk.note);
    } else {
      hint.textContent = 'Normally only on junk and debris hauling.';
    }

    function recalc() {
      var q = toCents(quote.value), s = toCents(surcharge.value);
      if (isNaN(q) || isNaN(s)) { liveTotal.textContent = '—'; return; }
      if (q == null) { liveTotal.textContent = '—'; return; }
      liveTotal.textContent = P.money(q + (s || 0));
    }
    quote.addEventListener('input', recalc);
    surcharge.addEventListener('input', recalc);

    var slotStartEl = document.getElementById('slot-start');
    var slotsEl     = document.getElementById('slots-needed');
    var echo        = document.getElementById('slot-echo');

    /* Spell the booking back out in hours, because 'slot 1, 2 slots' is not
       something anyone should have to decode at 6am. */
    var multiEl = document.getElementById('multi'), multiBox = document.getElementById('multi-box');
    var throughEl = document.getElementById('through'), throughSlotEl = document.getElementById('through-slot');
    function echoSlots() {
      var st = slotStartEl.value;
      slotsEl.disabled = multiEl.checked;
      if (st === '') { echo.textContent = 'No time set yet.'; return; }
      if (multiEl.checked) {
        var first = document.getElementById('scheduled').value, last = throughEl.value;
        if (!first || !last) { echo.textContent = 'Pick the first and last day.'; return; }
        if (last <= first) { echo.innerHTML = '<span style="color:var(--fire)"><b>The last day must be after the first.</b></span>'; return; }
        var probe = { scheduled_for: first, slot_start: Number(st), scheduled_through: last, through_slot: Number(throughSlotEl.value) };
        var days = {}; S.occupied(probe).forEach(function (o) { days[o.day] = 1; });
        echo.innerHTML = 'On site <b>' + P.esc(P.when(probe)) + '</b> \u2014 ' + Object.keys(days).length + ' working days';
        return;
      }
      var n = Number(slotsEl.value) || 1;
      var start = Number(st);
      if (start + n > S.slots.length) {
        echo.innerHTML = '<span style="color:var(--fire)"><b>Will not fit</b> \u2014 ' + n +
                         ' slots cannot start at ' + P.esc(S.slots[start].label) + '.</span>';
        return;
      }
      var from = S.slots[start].time.split('\u2013')[0].trim();
      var to   = S.slots[start + n - 1].time.split('\u2013')[1].trim();
      echo.innerHTML = 'On site <b>' + P.esc(from) + ' \u2013 ' + P.esc(to) + '</b>' +
                       (n > 1 ? ' (' + n + ' slots back to back)' : '');
    }
    slotStartEl.addEventListener('change', echoSlots);
    slotsEl.addEventListener('change', echoSlots);
    multiEl.addEventListener('change', function () { multiBox.hidden = !multiEl.checked; echoSlots(); });
    throughEl.addEventListener('change', echoSlots);
    throughSlotEl.addEventListener('change', echoSlots);
    document.getElementById('scheduled').addEventListener('change', echoSlots);
    echoSlots();

    var useReq = document.getElementById('use-requested');
    if (useReq) {
      useReq.addEventListener('click', function () {
        document.getElementById('scheduled').value = job.requested_day;
        if (job.requested_slot != null) slotStartEl.value = String(job.requested_slot);
        echoSlots();
      });
    }

    /* ------------------------------------------------------------------
       Turning the request down
       ------------------------------------------------------------------
       Nothing happens without a reason, and the reason is what the customer
       reads, so it is quoted to them rather than summarised. The server does
       the same checks again — this is only about not wasting Bryan's time
       with a round trip he was always going to lose. */
    /* Documents (2026-10-03): contracts, estimates and photos of a paper
       agreement. Uploaded here or from either phone; private storage; the
       customer sees them in their portal; removing one is soft and undoable. */
    (function () {
      var box = document.createElement('div');
      box.className = 'panel-card';
      box.style.marginTop = '22px';
      box.innerHTML = '<h2 style="margin-top:0">Documents</h2><div id="doc-list"><p style="color:var(--muted)">Loading\u2026</p></div>' +
        (job.deleted_at ? '' : P.demo ? '<p class="form-note" style="text-align:left;margin:0">In the tour no files are stored, so adding one is switched off.</p>' :
        '<form id="doc-form" class="doc-form">' +
          '<div class="field-2">' +
            '<div class="field" style="margin:0"><label for="doc-kind">Kind</label><select id="doc-kind">' +
              '<option value="estimate">Estimate</option><option value="contract">Contract</option><option value="other">Other</option></select></div>' +
            '<div class="field" style="margin:0"><label for="doc-file">File <span class="hint">(PDF, JPEG or PNG, up to 15 MB)</span></label>' +
              '<input type="file" id="doc-file" accept="application/pdf,image/jpeg,image/png"></div>' +
          '</div>' +
          '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" type="submit" id="doc-up">Add document</button></div>' +
          '<p class="form-note" style="text-align:left;margin:8px 0 0">The customer can see it in their account; Bryan\u2019s and his wife\u2019s phones get a copy.</p>' +
        '</form>');
      root.appendChild(box);
      var list = box.querySelector('#doc-list');

      async function draw() {
        var r = await P.client().from('job_documents').select('*').eq('job_id', id).order('created_at', { ascending: true });
        var docs = (r && r.data) || [];
        if (!docs.length) { list.innerHTML = '<p style="color:var(--muted);margin:0 0 12px">None yet.</p>'; return; }
        list.innerHTML = '<ul class="doc-list">' + docs.map(function (d) {
          var off = !!d.deleted_at, pending = d.status !== 'ready';
          return '<li' + (off ? ' class="is-off"' : '') + '>' +
            (pending || off ? '<span><b>' + P.esc(P.DOC_KIND[d.kind] || 'Document') + '</b> ' + P.esc(d.name) + '</span>'
                            : '<button type="button" class="doc-open" data-path="' + P.esc(d.storage_path) + '"><b>' +
                              P.esc(P.DOC_KIND[d.kind] || 'Document') + '</b> ' + P.esc(d.name) + '</button>') +
            '<span>' + P.esc(P.size(d.size)) + ' \u00b7 ' + P.esc(P.dateTime(d.created_at) || '') +
              (pending ? ' \u00b7 upload not finished' : '') + (off ? ' \u00b7 removed' : '') + '</span>' +
            (pending ? '' : '<button type="button" class="linkish" data-' + (off ? 'restore' : 'remove') + '="' + P.esc(d.id) + '">' +
              (off ? 'Restore' : 'Remove') + '</button>') +
          '</li>';
        }).join('') + '</ul>';
        list.querySelectorAll('[data-path]').forEach(function (b) { b.addEventListener('click', function () { P.openDocument(b.dataset.path); }); });
        list.querySelectorAll('[data-remove],[data-restore]').forEach(function (b) {
          b.addEventListener('click', async function () {
            var restore = !!b.dataset.restore, docId = b.dataset.restore || b.dataset.remove;
            if (!restore) {
              var ok = await P.confirm({ title: 'Remove this document?',
                body: 'The customer will no longer see it. Phones keep their copy, marked as removed. You can restore it.',
                ok: 'Remove', cancel: 'Keep it', danger: true });
              if (!ok) return;
            }
            var rr = await P.client().rpc('admin_document_delete', { p_id: docId, p_restore: restore });
            if (rr.error) return flash('Could not do that: ' + rr.error.message);
            tellPhones(id, 'document');
            flash(restore ? 'Restored' : 'Removed'); draw();
          });
        });
      }
      draw();

      var form = box.querySelector('#doc-form');
      if (form) form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var file = box.querySelector('#doc-file').files[0], kind = box.querySelector('#doc-kind').value;
        if (!file) return flash('Pick a file first.');
        if (['application/pdf', 'image/jpeg', 'image/png'].indexOf(file.type) === -1) return flash('Only PDF, JPEG and PNG files can be added.');
        if (file.size > 15 * 1024 * 1024) return flash('That file is too big. 15 MB at most.');
        var btn = box.querySelector('#doc-up'); btn.disabled = true; btn.textContent = 'Uploading\u2026';
        try {
          var docId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
          var st = await P.client().rpc('admin_document_start', { p_id: docId, p_job: id, p_kind: kind, p_name: file.name, p_mime: file.type, p_size: file.size });
          if (st.error) throw st.error;
          var up = await P.client().storage.from('job-documents').upload(st.data.storage_path, file, { contentType: file.type, upsert: true });
          if (up.error) throw up.error;
          var hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', await file.arrayBuffer())))
            .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
          var rd = await P.client().rpc('admin_document_ready', { p_id: docId, p_sha256: hash });
          if (rd.error) throw rd.error;
          tellPhones(id, 'document');
          flash('Document added'); form.reset(); draw();
        } catch (err) {
          flash('Could not add it: ' + (err && err.message ? err.message : 'try again'));
        } finally { btn.disabled = false; btn.textContent = 'Add document'; }
      });
    })();

    /* Delete / Restore (2026-10-03). A soft delete: the job leaves every list,
       the calendar, the customer's portal and both phones, and nobody is
       emailed. Restore puts it back. A customer job that needs a reason sent
       is turned down instead (the box above). */
    (function () {
      var wrap = document.createElement('div');
      wrap.className = 'panel-card' + (job.deleted_at ? ' panel-card--act' : '');
      wrap.style.marginTop = '22px';
      if (job.deleted_at) {
        wrap.innerHTML = '<h2 style="margin-top:0">Deleted</h2>' +
          '<p>Deleted ' + P.esc(P.dateTime(job.deleted_at) || '') + '. It is hidden from the job board, the schedule, ' +
          'the customer\u2019s portal and both phones. Nothing was sent to the customer.</p>' +
          '<div class="btn-row"><button class="btn btn-primary" type="button" id="restore-job">Restore this job</button></div>';
      } else {
        wrap.innerHTML = '<button type="button" class="linkish" id="delete-job" style="color:var(--fire)">Delete this job\u2026</button>' +
          '<p class="form-note" style="text-align:left;margin:6px 0 0">For test jobs and mistakes. The customer is not told; ' +
          'to turn a real request down with a reason, use the box above.</p>';
      }
      root.appendChild(wrap);
      var delBtn = document.getElementById('delete-job'), resBtn = document.getElementById('restore-job');
      if (delBtn) delBtn.addEventListener('click', async function () {
        var ok = await P.confirm({
          title: 'Delete this job?',
          body: 'It will also disappear from Bryan\u2019s and his wife\u2019s MyDiD. The customer is not emailed. You can restore it afterwards.',
          ok: 'Delete', cancel: 'Keep it', danger: true
        });
        if (!ok) return;
        var r = await P.client().rpc('admin_delete_job', { p_job: id });
        if (r.error) return flash('Could not delete: ' + r.error.message);
        tellPhones(id, 'deleted');
        flash('Deleted');
        if (await reload()) paint([]);
      });
      if (resBtn) resBtn.addEventListener('click', async function () {
        var r = await P.client().rpc('admin_restore_job', { p_job: id });
        if (r.error) return flash('Could not restore: ' + r.error.message);
        tellPhones(id, 'restored');
        flash('Restored');
        if (await reload()) {
          var ev = await P.client().from('job_events').select('*').eq('job_id', id).order('created_at', { ascending: false });
          paint(ev.data || []);
        }
      });
    })();

    var cancelOpen = document.getElementById('cancel-open');
    if (cancelOpen) {
      var box   = document.getElementById('cancel-box');
      var why   = document.getElementById('cancel-why');
      var count = document.getElementById('cancel-count');
      var stat  = document.getElementById('cancel-status');
      var QUICK = [
        'Booked solid until the end of the month \u2014 I did not want to leave you waiting on me.',
        'This one is outside the area I cover.',
        'This is not work I take on, and you would be better off with someone who does it every day.'
      ];

      var tell = function (msg, good) {
        stat.textContent = msg;
        stat.classList.add('is-visible');
        stat.style.background   = good ? 'var(--sky-050)' : 'var(--fire-050)';
        stat.style.borderColor  = good ? 'var(--sky-line)' : '#E8C0B6';
        stat.style.color        = good ? 'var(--pine-700)' : 'var(--fire)';
      };
      var tally = function () {
        var n = why.value.trim().length;
        count.textContent = n < 3
          ? 'Say why before you send this.'
          : n + ' character' + (n === 1 ? '' : 's') + ' \u2014 this is quoted to them exactly as written.';
      };

      cancelOpen.addEventListener('click', function () {
        box.hidden = false; cancelOpen.hidden = true; why.focus(); tally();
      });
      document.getElementById('cancel-back').addEventListener('click', function () {
        box.hidden = true; cancelOpen.hidden = false;
      });
      why.addEventListener('input', tally);
      box.querySelectorAll('[data-why]').forEach(function (b) {
        b.addEventListener('click', function () {
          why.value = QUICK[Number(b.dataset.why)] || '';
          why.focus(); tally();
        });
      });

      document.getElementById('cancel-do').addEventListener('click', async function () {
        var btn = this, reason = why.value.trim();
        if (reason.length < 3) { why.focus(); return tell('Say why first. They are shown exactly what you write.', false); }

        var sure = await P.confirm({
          title: 'Turn this request down?',
          body: (job.contact_email
                  ? (job.contact_name || 'They') + ' gets an email with this reason in it, straight away:\n\n'
                  : 'Nobody is emailed \u2014 there is no address on this request \u2014 but the reason is written down:\n\n') +
                '\u201c' + reason + '\u201d',
          ok: 'Yes, turn it down', cancel: 'Not yet', danger: true
        });
        if (!sure) return;

        btn.disabled = true; btn.textContent = 'Sending\u2026';
        var r = await cancelJob(id, reason);
        btn.disabled = false; btn.textContent = job.contact_email ? 'Cancel it and tell them' : 'Cancel it';

        if (r.error) return tell(r.error, false);
        flash(r.emailed ? 'Turned down \u2014 the email is on its way' : (r.note || 'Turned down'));
        if (!r.emailed && r.note) tell(r.note, false);
        if (await reload()) {
          var ev2 = await P.client().from('job_events').select('*').eq('job_id', id)
            .order('created_at', { ascending: false });
          paint(ev2.data || []);
        }
      });
    }

    document.getElementById('save-notes').addEventListener('click', async function () {
      var res = await P.client().from('job_notes').upsert({
        job_id: id,
        body: document.getElementById('admin-notes').value,
        updated_at: new Date().toISOString()
      });
      flash(res.error ? 'Could not save: ' + res.error.message : 'Notes saved');
    });

    document.getElementById('save').addEventListener('click', async function () {
      var btn    = this;
      var status = document.getElementById('save-status');
      var q = toCents(quote.value), s = toCents(surcharge.value);

      function bad(msg) {
        status.textContent = msg;
        status.classList.add('is-visible');
        status.style.background = 'var(--fire-050)';
        status.style.borderColor = '#E8C0B6';
        status.style.color = 'var(--fire)';
      }

      if (isNaN(q)) return bad('The price needs to be a number, like 450 or 450.00');
      if (isNaN(s)) return bad('The disposal fee needs to be a number, like 60 or 60.00');

      var newStatus = document.getElementById('status').value;
      var before    = job && job.status;
      var note      = document.getElementById('note').value.trim();

      if (newStatus === 'quoted' && q == null) {
        return bad('Set a price before marking this quoted — the customer would see a quote with no figure.');
      }
      var slotStartRaw = document.getElementById('slot-start').value;
      var slotStart   = slotStartRaw === '' ? null : Number(slotStartRaw);
      var slotsNeeded = Number(document.getElementById('slots-needed').value) || 1;
      var theDate     = document.getElementById('scheduled').value || null;

      if (newStatus === 'scheduled' || newStatus === 'in_progress') {
        if (!theDate)           return bad('Set a date before marking this scheduled.');
        if (slotStart === null) return bad('Pick a start slot before marking this scheduled.');
      }
      var multi = document.getElementById('multi').checked;
      var through = multi ? (document.getElementById('through').value || null) : null;
      var throughSlot = multi ? Number(document.getElementById('through-slot').value) : null;
      if (multi) {
        if (!theDate || slotStart === null) return bad('Pick the first day and a start slot before the last day.');
        if (!through || through <= theDate) return bad('Pick a last day after the first day.');
      }
      if (!multi && slotStart !== null && slotStart + slotsNeeded > S.slots.length) {
        return bad('That does not fit in the day. ' + slotsNeeded +
                   ' slots cannot start at ' + S.slots[slotStart].label + '.');
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      var res = await P.client().from('jobs').update({
        status:          newStatus,
        quote_cents:     q,
        surcharge_cents: s || 0,
        scheduled_for:   theDate,
        slot_start:      slotStart,
        slots_needed:    slotsNeeded,
        scheduled_through: through,
        through_slot:    throughSlot
      }).eq('id', id);

      /* A note is its own timeline entry. The status change writes one by
         itself via the trigger, so this is only for Bryan's own message. */
      if (!res.error && note) {
        await P.client().from('job_events').insert({ job_id: id, status: null, note: note, author: 'bryan' });
      }

      btn.disabled = false;
      btn.textContent = 'Save changes';

      if (res.error) return bad('Could not save: ' + res.error.message);

      flash('Saved');
      tellPhones(id, newStatus === 'scheduled' && before !== 'scheduled' ? 'booked' : 'changed');
      if (await reload()) {
        var ev = await P.client().from('job_events').select('*')
          .eq('job_id', id).order('created_at', { ascending: false });
        paint(ev.data || []);
      }
    });
  }

  (async function () {
    var session = await P.requireSession('../portal/login.html');
    if (!session) return;

    var profile = await P.profile();
    if (!profile || !profile.is_admin) {
      root.innerHTML = '<div class="portal-empty"><h2>This page is Bryan’s</h2>' +
        '<p>Your account does not have admin access.</p>' +
        '<a class="btn btn-outline" href="../portal/index.html">Your own jobs</a></div>';
      return;
    }

    if (!id || !(await reload())) return;
    var ev = await P.client().from('job_events').select('*')
      .eq('job_id', id).order('created_at', { ascending: false });
    paint(ev.data || []);
  })();
})();
</script>
</body>
</html>
