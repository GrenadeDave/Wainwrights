<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../favicon.png">

</head>
<body class="portal-body">

<header class="site-header portal-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="../assets/img/logo-badge-dark-256.png" width="256" height="256" alt="">
      <span class="brand-text"><span class="brand-name">Wainwright’s</span><span class="brand-sub">Reviews</span></span>
    </a>
    <div class="who who--admin">
      <a class="plain" href="index.html">Job board</a>
      <a class="plain" href="schedule.html">Schedule</a>
      <a class="plain" href="mydid.html">MyDiD</a>
      <a class="plain" href="team.html">Admins</a>
      <a class="plain" href="../index.html">Leave the tour</a>
    </div>
  </div>
</header>

<main class="portal-main">
  <div class="wrap wrap--portal" id="root">
    <p style="color:var(--muted)">Loading&hellip;</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="../assets/js/config.js?v=82fdb64d"></script>
<script src="../assets/js/rates.js?v=4b364822"></script>
<script src="../assets/js/schedule.js?v=4a64207c"></script>
<script src="../assets/js/supabase-config.js?v=79cace19"></script>
<script src="../assets/js/portal.js?v=0fa966a1"></script>
<script src="../assets/js/portal-demo.js?v=0393f0a7"></script>
<script src="../assets/js/site.js?v=bb198635"></script>
<script>
(function () {
  'use strict';
  var P = window.WPortal;
  var root  = document.getElementById('root');
  var toast = document.getElementById('toast');

  if (!P.ready()) { root.innerHTML = P.notConfiguredHtml(); return; }

  /* The tour copy of this page swaps Sign out for "Leave the tour", so the
     button is not always here. */
  var signout = document.getElementById('signout');
  if (signout) signout.addEventListener('click', async function (e) {
    e.preventDefault();
    await P.signOut();
    window.location.replace('../portal/login.html');
  });

  function flash(m) {
    toast.textContent = m; toast.classList.add('is-up');
    setTimeout(function () { toast.classList.remove('is-up'); }, 2600);
  }

  function stars(n) {
    if (!n) return '<span style="color:var(--muted)">no stars given</span>';
    var s = '';
    for (var i = 1; i <= 5; i++) s += '<span style="color:' + (i <= n ? 'var(--amber)' : 'var(--line)') + '">&#9733;</span>';
    return s;
  }

  /* The only reasons a review may come down. Taken from the FTC's Consumer
     Review rule, 16 CFR 465.7(b) (checked at ecfr.gov, 2026-09-30), plus two
     that are not suppression at all. The database refuses anything else.
     The same codes live in admin_remove_review() — change both together. */
  var REASONS = [
    ['fake',             'Fake, spam or written by a bot',                         'You have a real reason to believe no genuine customer wrote it.'],
    ['unrelated',        'Not about Bryan\u2019s work or services',               'An advert, a rant about something else, a wrong business.'],
    ['abusive',          'Defamatory, harassing, abusive, obscene, vulgar or sexually explicit', ''],
    ['discriminatory',   'Discriminatory about race, gender, sexuality, ethnicity or another intrinsic characteristic', ''],
    ['private_info',     'Has someone else\u2019s personal information or picture', 'A phone number, address or name of another person. The text is not kept in the log.'],
    ['confidential',     'Has trade secrets or confidential business or money details', ''],
    ['false',            'Clearly false or misleading',                             'Only a plain falsehood (a job that never happened, the wrong company). Not a fair complaint you disagree with.'],
    ['test',             'A test we made \u2014 not from a customer',              ''],
    ['reviewer_request', 'The person who wrote it asked for it to be removed',     'Say when and how they asked. The text is not kept in the log.']
  ];
  var LABEL = {}; REASONS.forEach(function (r) { LABEL[r[0]] = r[1]; });

  function card(r) {
    var live = r.status === 'published';
    return '<div class="panel-card' + (r.status === 'pending' ? ' panel-card--act' : '') + '" style="margin-bottom:16px" id="rv-' + r.id + '">' +
      '<div class="status-line">' +
        (r.status === 'pending' ? '<span class="pill pill--act">Waiting for you</span>'
         : live ? '<span class="pill pill--ok">On the website</span>'
                : '<span class="pill">Hidden</span>') +
        '<span>' + stars(r.rating) + '</span>' +
        '<span style="color:var(--muted)">' + P.esc(P.dateTime(r.created_at) || '') + '</span>' +
        (live ? '<span style="color:var(--muted)">' + (r.upvotes || 0) + ' found it helpful</span>' : '') +
      '</div>' +
      '<p style="white-space:pre-wrap;font-size:1.0625rem">' + P.esc(r.body) + '</p>' +
      '<p style="color:var(--muted);margin-bottom:16px"><b style="color:var(--ink)">' + P.esc(r.name) + '</b>' +
        (r.town ? ' &middot; ' + P.esc(r.town) : '') + '</p>' +
      (r.status === 'hidden' && r.removal_reason
        ? '<p class="form-note" style="text-align:left;margin:0 0 16px"><b>Taken down because:</b> ' + P.esc(LABEL[r.removal_reason] || r.removal_reason) +
          (r.removal_note ? ' &mdash; ' + P.esc(r.removal_note) : '') + '</p>' : '') +
      '<div class="btn-row">' +
        (r.status !== 'published'
          ? '<button class="btn btn-primary" type="button" data-show="' + r.id + '">Put it on the website</button>' : '') +
        (r.status !== 'hidden'
          ? '<button class="btn btn-outline" type="button" data-remove="hide" data-id="' + r.id + '">Take it down&hellip;</button>' : '') +
        '<button class="btn btn-dark" type="button" data-remove="delete" data-id="' + r.id + '">Delete&hellip;</button>' +
      '</div>' +
      '<div class="rv-why" hidden></div>' +
    '</div>';
  }

  /* The reason form opens inside the card, so Bryan sees the review he is judging. */
  function reasonForm(action) {
    return '<form class="rv-form" style="margin-top:18px;padding-top:18px;border-top:1px solid var(--line)">' +
      '<p style="font-weight:700;margin:0 0 6px">' + (action === 'hide' ? 'Why is it coming down?' : 'Why is it being deleted?') + '</p>' +
      '<p class="form-note" style="text-align:left;margin:0 0 12px">Pick the one that fits. Being critical, a low star rating or an unfair-feeling complaint is <b>not</b> a reason &mdash; those stay up.</p>' +
      REASONS.map(function (x) {
        return '<label style="display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;cursor:pointer">' +
          '<input type="radio" name="reason" value="' + x[0] + '" required style="margin-top:4px">' +
          '<span><b style="font-weight:600">' + x[1] + '</b>' + (x[2] ? '<br><small style="color:var(--muted)">' + x[2] + '</small>' : '') + '</span></label>';
      }).join('') +
      '<label style="display:block;margin:14px 0 6px;font-weight:600" for="rv-note">What makes it fit? <small style="color:var(--muted);font-weight:400">(kept in the log)</small></label>' +
      '<textarea name="note" id="rv-note" maxlength="500" required rows="3" style="width:100%;font:inherit" placeholder="For example: the same text was sent five times from different names."></textarea>' +
      '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn ' + (action === 'hide' ? 'btn-outline' : 'btn-dark') + '" type="submit">' + (action === 'hide' ? 'Take it down' : 'Delete for good') + '</button>' +
        '<button class="btn btn-outline" type="button" data-cancel>Keep it</button>' +
      '</div>' +
      '<p class="form-note rv-err" style="text-align:left;color:var(--danger,#b42318)" hidden></p>' +
    '</form>';
  }

  function logRow(x) {
    return '<li style="margin:0 0 14px">' +
      '<b>' + P.esc(x.name || 'Unnamed') + '</b>' + (x.rating ? ' &middot; ' + x.rating + '&#9733;' : '') +
      ' &middot; ' + (x.action === 'deleted' ? 'deleted' : 'taken down') + ' ' + P.esc(P.dateTime(x.removed_at) || '') +
      (x.removed_by_email ? ' by ' + P.esc(x.removed_by_email) : '') +
      '<br><span>' + P.esc(LABEL[x.reason] || x.reason) + '</span>' +
      '<br><small style="color:var(--muted)">' + P.esc(x.note) + '</small></li>';
  }

  async function paint() {
    var res = await P.client().from('reviews').select('*').order('created_at', { ascending: false });
    if (res.error) {
      root.innerHTML = '<div class="portal-empty"><h2>Could not load</h2><p>' + P.esc(res.error.message) + '</p></div>';
      return;
    }
    var logRes = await P.client().from('review_removals').select('*').order('removed_at', { ascending: false });
    var log = (logRes && logRes.data) || [];
    var all = res.data || [];
    var waiting = all.filter(function (r) { return r.status === 'pending'; });
    var live    = all.filter(function (r) { return r.status === 'published'; });
    var hidden  = all.filter(function (r) { return r.status === 'hidden'; });

    root.innerHTML =
      '<div class="portal-title"><h1>Reviews</h1>' +
        '<p>Nothing goes on the website until you say so.</p>' +
        '<p class="form-note" style="text-align:left;margin-top:8px"><b>The rule:</b> put up every genuine review, good or bad. Taking one down or deleting it needs one of the reasons the FTC\u2019s review rule allows, and a note. Every one is written to the removal log below, which nobody can edit. Hiding a review because it is critical breaks the FTC\u2019s rule, and the review page promises customers you will not.</p></div>' +
      (waiting.length ? '<h2 class="p-h2">Waiting for you</h2>' + waiting.map(card).join('') : '') +
      (live.length ? '<h2 class="p-h2">On the website</h2>' + live.map(card).join('') : '') +
      (hidden.length ? '<h2 class="p-h2">Taken down</h2>' + hidden.map(card).join('') : '') +
      (all.length ? '' : '<div class="portal-empty"><h2>None yet</h2>' +
        '<p>When a customer leaves one it lands here, and you get an email. ' +
        'The page they use is <b style="overflow-wrap:anywhere">wainwrightshandyman.com/review.html</b> &mdash; worth texting to anyone happy with a job.</p></div>') +
      (log.length ? '<h2 class="p-h2">Removal log</h2><div class="panel-card"><ul style="list-style:none;padding:0;margin:0">' +
        log.map(logRow).join('') + '</ul></div>' : '');

    root.querySelectorAll('[data-show]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var r = await P.client().from('reviews')
          .update({ status: 'published', published_at: new Date().toISOString() })
          .eq('id', b.dataset.show);
        flash(r.error ? 'Could not do that: ' + r.error.message : 'It is on the website now');
        paint();
      });
    });

    root.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        var action = b.dataset.remove, id = b.dataset.id;
        var box = document.getElementById('rv-' + id).querySelector('.rv-why');
        box.innerHTML = reasonForm(action); box.hidden = false;
        var form = box.querySelector('form'), err = box.querySelector('.rv-err');
        box.querySelector('[data-cancel]').addEventListener('click', function () { box.hidden = true; box.innerHTML = ''; });
        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          var reason = (form.querySelector('input[name="reason"]:checked') || {}).value;
          var note = form.note.value.trim();
          if (!reason) { err.textContent = 'Pick a reason.'; err.hidden = false; return; }
          if (note.length < 5) { err.textContent = 'Add a short note saying what makes it fit.'; err.hidden = false; return; }
          var sub = form.querySelector('[type="submit"]'); sub.disabled = true;
          var r = await P.client().rpc('admin_remove_review', { p_review: id, p_action: action, p_reason: reason, p_note: note });
          sub.disabled = false;
          if (r.error) { err.textContent = r.error.message; err.hidden = false; return; }
          flash(action === 'hide' ? 'Taken down, and logged' : 'Deleted, and logged');
          paint();
        });
      });
    });
  }

  (async function () {
    var session = await P.requireSession('../portal/login.html');
    if (!session) return;
    var profile = await P.profile();
    if (!profile || !profile.is_admin) {
      root.innerHTML = '<div class="portal-empty"><h2>This page is Bryan’s</h2>' +
        '<p>Your account does not have admin access.</p>' +
        '<a class="btn btn-outline" href="../portal/index.html">Your own jobs</a></div>';
      return;
    }
    paint();
  })();
})();
</script>
</body>
</html>
